<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline — Famili Water</title>
  <meta name="theme-color" content="#3DC2FF">

<!-- PWA manifest -->
<link rel="manifest" href="manifest.json">

<!-- Chrome PWA Icons -->
<link rel="icon" sizes="192x192" href="icon-192.png">
<link rel="icon" sizes="512x512" href="icon-512.png">

<!-- Safari PWA Icon -->
<link rel="apple-touch-icon" href="icon-192.png">

<!-- Mobile behavior -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#f4f8fb;
      color:#0b3b55;
      margin:0;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      text-align:center;
      padding:24px
    }
    .box{max-width:560px}

    /* === Logo Bulat === */
    .logo{
      width:120px;
      height:120px;
      object-fit:cover;
      border-radius:50%;
      margin-bottom:18px;
      border:4px solid #3DC2FF;
      box-shadow:0 4px 8px rgba(0,0,0,0.15);
    }

    h1{color:#0e6fb6;margin-bottom:8px}
    p{opacity:.9}
    .btn{
      display:inline-block;
      margin-top:18px;
      padding:10px 16px;
      border-radius:8px;
      background:#3DC2FF;
      color:white;
      text-decoration:none;
      font-weight:700
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="/logofw.png" alt="Logo Famili Water" class="logo">

    <h1>Anda sedang offline</h1>
    <p>Maaf, halaman ini tidak dapat dimuat karena tidak ada koneksi internet. 
    Beberapa fitur seperti login dan register mungkin tidak berfungsi.</p>

    <a href="/index.html" class="btn">Kembali ke Beranda</a>
  </div>
</body>
<script>
    // register service worker if supported
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('SW registered', reg.scope))
          .catch(err => console.warn('SW register failed', err));
      });
    }
</script>
</html>
